{% extends 'base.html' %}
{% load widget_tweaks %}
{% block title %}Login with OTP{% endblock %}

{% block content %}
<div style="min-height:80vh; display:flex; align-items:center; background:var(--off-white); padding:48px 0">
  <div class="container px-4">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">

        <div style="text-align:center; margin-bottom:32px">
          <div style="width:64px; height:64px; background:linear-gradient(135deg,var(--navy),var(--navy-mid)); border-radius:var(--radius); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:28px; color:var(--gold)">
            <i class="fas fa-mobile-alt"></i>
          </div>
          <h2 style="font-family:'Playfair Display',serif; margin-bottom:6px">OTP Login</h2>
          <p style="color:var(--gray-600); font-size:14px">Login securely without a password</p>
        </div>

        <div class="form-section">
          <div class="form-section-header">
            <div style="display:flex; align-items:center; gap:10px">
              <i class="fas fa-phone-alt" style="font-size:18px"></i>
              <span style="font-weight:700">Enter Phone Number</span>
            </div>
          </div>
          <div class="form-section-body">
            <form method="post">
              {% csrf_token %}
              <div class="mb-4">
                <label class="form-label text-muted">Registered Mobile Number</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0">+91</span>
                  <input type="text" name="phone" class="form-control border-start-0" placeholder="10-digit mobile number" required pattern="\d{10}">
                </div>
                <div class="form-text text-muted mt-2">We will send a 6-digit OTP to this number.</div>
              </div>
              <button type="submit" class="btn-primary-civic w-100" style="justify-content:center; border-radius:var(--radius-sm); padding:13px">
                <i class="fas fa-paper-plane me-2"></i> Request OTP
              </button>
            </form>
            <div style="text-align:center; margin-top:20px; font-size:14px; color:var(--gray-600)">
              <a href="{% url 'login' %}" style="color:var(--navy); font-weight:600; text-decoration:none"><i class="fas fa-arrow-left me-1"></i> Back to Password Login</a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}
